{% extends 'base.html' %}

{% block content %}
    <div class="min-h-screen flex items-center justify-center -mt-10">
        <div class="bg-white rounded-lg shadow-sm p-8 w-full max-w-md">

            <div class="text-center mb-8">
                <div class="text-4xl mb-2">🎫</div>
                <h1 class="text-2xl font-bold">Linia</h1>
                <p class="text-slate-500 text-sm mt-1">Queue Management System</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-4">
                        <label class="block font-semibold mb-1 text-slate-700">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                            <p class="text-red-500 text-sm mt-1">
                                {{ field.errors }}
                            </p>
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition font-semibold mt-2">
                    Login
                </button>
            </form>
        </div>
    </div>
{% endblock %}d
