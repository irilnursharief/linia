{% extends 'base.html' %}

{% block content %}
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-sm p-8">
        <h1 class="text-2xl font-bold mb-6">Login</h1>
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-4">
                    <label class="block font-semibold mb-1 text-slate-700">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-sm mt-1">{{ field.errors }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition font-semibold">
                Login
            </button>
        </form>
    </div>
{% endblock %}
